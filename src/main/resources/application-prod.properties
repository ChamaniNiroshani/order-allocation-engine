# Production: one small instance (512 MB) with a managed PostgreSQL. Setup: docs/deploy.md.

# Structured logs: one JSON object per line in the Elastic Common Schema. MDC (requestId, orderId, traceId, spanId)
# and the key/values of business events become fields, so a log system can filter on them.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}

# The database comes from the environment, with no local fallback: a missing variable fails the startup
# instead of connecting to localhost with the development password.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Nothing to start: the database is managed. (spring-boot-docker-compose is for local development.)
spring.docker.compose.enabled=false
# Flyway brings the schema up to date at startup; the dev seed data is not on its path here.
spring.flyway.enabled=true

# A small pool: a free database has limited connections and compute, a small instance cannot use many at once, and
# during a deploy the old and the new instance are connected at the same time.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Longer than the local 3 s (see application.properties): a suspended free database has to wake up first, and the TLS
# handshake runs on very little CPU. These values are a margin, not a measurement.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# The host says which port to listen on (Render sets PORT).
server.port=${PORT:8080}
# TLS ends at the host's proxy: use its X-Forwarded-* headers, so that generated URLs (Swagger UI) are https.
server.forward-headers-strategy=framework

# Public instance: health only. No metrics, prometheus or info.
management.endpoints.web.exposure.include=health
# Nothing can read the reservations.active gauge here, so do not query the database every 5 s to refresh it. A free
# database that bills awake time cannot sleep while the app keeps querying. (The 30 s expiry job has to stay.)
metrics.reservations.enabled=false

# No tracing backend in production yet: do not export spans (see application.properties). Turn on by setting this to true
# (or MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED=true) together with management.otlp.tracing.endpoint.
management.otlp.tracing.export.enabled=false

# Swagger UI stays on in prod on purpose: this is a public demo. A real production service would put it behind auth.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
