spring.application.name=order-allocation-engine

# Local dev: Spring Boot starts Postgres from compose.yaml and wires the connection automatically.
# These values are only fallbacks (e.g. when running without Docker Compose support).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/order_allocation_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Fail fast when the database is gone. Hikari's default is 30 s: in the chaos run (docs/chaos.md) every request simply hung
# for about 25 s during a 20 s outage, and readiness hung with them. 3 s means a request without a connection is answered
# with 503 + Retry-After, and the readiness check turns DOWN, within seconds. (validation-timeout must be below it.)
# Override with SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT (milliseconds).
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
# Retry-After (seconds) sent with the 503 for "database unavailable" (GlobalExceptionHandler)
api.unavailable.retry-after-seconds=5

# Docker Compose support: start the DB on app start, keep it running after the app stops
spring.docker.compose.lifecycle-management=start-only

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# How concurrent allocations for the same item are serialized: PESSIMISTIC | OPTIMISTIC | ATOMIC_UPDATE
# PESSIMISTIC is the default: see docs/adr/0003-default-locking-strategy.md
allocation.locking-mode=PESSIMISTIC
# OPTIMISTIC only: how many tries an allocation gets before it gives up with 503 + Retry-After (StockContentionException)
allocation.optimistic.max-attempts=5

# Actuator: only these four endpoints are exposed. prometheus is what Prometheus scrapes; metrics is what the load tests read.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Kubernetes-style probes: /actuator/health/liveness and /actuator/health/readiness.
# Readiness includes the database, so an instance without a working DB is taken out of rotation, not restarted.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Tag every metric with the application name so dashboards can filter on it
management.metrics.tags.application=${spring.application.name}
# /actuator/info: app name here, build version and time from build-info (spring-boot-maven-plugin)
management.info.env.enabled=true
info.app.name=${spring.application.name}

# reservations.active gauge: how often the number of RESERVED orders is re-read (the scrape reads the cached value)
metrics.reservations.enabled=true
metrics.reservations.refresh-interval=5s

# Tracing: every request is a trace (HTTP -> saga steps -> payment gateway -> JDBC), exported over OTLP/HTTP to Jaeger.
# Sampling 1.0 = every request, right for local development; use something like 0.1 in production.
# Both can be overridden by environment variables, e.g. MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
# Export on/off. ON here because locally compose starts Jaeger. OFF in the prod profile (application-prod.properties) until a
# tracing backend exists: with nothing listening, the exporter would log an ERROR every few seconds. Spans are still created and
# trace ids still appear in the logs when export is off. Override with MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED=true|false.
management.otlp.tracing.export.enabled=true
# JDBC as spans: the connection (so a wait for a pooled connection shows) and each query (so a wait for a row lock
# shows as one long SELECT ... FOR UPDATE). Result-set fetches are left out as noise. Parameter VALUES are never recorded.
jdbc.includes=connection,query
jdbc.datasource-proxy.include-parameter-values=false

# Client-side limit on ONE payment charge call, whatever the gateway does. When it is exceeded the saga treats it exactly like
# a gateway timeout (refund by idempotency key + compensate, answer 502). Separate from payment.fake.timeout-ms below, which
# only simulates a gateway that never answers. Override with PAYMENT_TIMEOUT.
payment.timeout=10s

# Fake payment gateway (checkout saga): how often it declines / times out, and how slow it is
payment.fake.failure-rate=0.0
payment.fake.latency-ms=50
payment.fake.timeout-rate=0.0
payment.fake.timeout-ms=2000

# Checkout saga: a reservation waits this long for its payment; the job that expires them runs every interval
checkout.reservation-ttl=5m
checkout.expiry.enabled=true
checkout.expiry.interval=30s
checkout.expiry.batch-size=100

# Logging. Locally: readable text with the request id, the trace id (when tracing is on) and, inside an order, the order id; business events add
# their key=value fields at the end of the line. SQL is NOT logged by default: activate the dev profile for that.
# The json and prod profiles switch to structured JSON (application-json.properties, application-prod.properties).
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [req=%X{requestId:--} trace=%X{traceId:--} order=%X{orderId:--}] %-28.28logger{27} : %m %kvp%n%wEx

spring.jpa.open-in-view=false

# Hibernate's SqlExceptionHelper writes a WARN + ERROR (with the SQL state) for EVERY failed JDBC call, and then the exception
# propagates to GlobalExceptionHandler, which decides how to log it. During a database outage that was ~600 ERROR lines in a
# minute on top of the handler's own (chaos run, docs/chaos.md). It is switched off so each failure is logged once, by the handler:
# "database unavailable" as one rate-limited WARN, anything unexpected as "Unhandled exception" with its stack trace.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Flyway: schema migrations only. The dev profile adds classpath:db/seed (demo warehouses and batches), see application-dev.properties.
spring.flyway.locations=classpath:db/migration
