spring.application.name=order-allocation-engine

# Local dev: Spring Boot starts Postgres from compose.yaml and wires the connection automatically.
# These values are only fallbacks (e.g. when running without Docker Compose support).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/order_allocation_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Docker Compose support: start the DB on app start, keep it running after the app stops
spring.docker.compose.lifecycle-management=start-only
# Integration tests also use the compose DB (until we move to Testcontainers, OAE-08)
spring.docker.compose.skip.in-tests=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false