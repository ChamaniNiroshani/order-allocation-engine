# Local development: print every SQL statement. Activate with  --spring.profiles.active=dev  (SPRING_PROFILES_ACTIVE=dev).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dev only: also load the demo warehouses and batches (db/seed, repeatable migration). Never active without the dev profile.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
