# Tests: the scheduled expiry job must not run on its own; tests call its methods directly.
checkout.expiry.enabled=false
# Tracing is off in tests: nothing may depend on Jaeger, and nothing is exported. (Observations still run; the
# tests that check the spans use a recording handler, not an exporter.)
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
# Same for the reservations.active gauge refresher: tests call refresh() themselves.
metrics.reservations.enabled=false
