services:
  postgres:
    image: postgres:18
    container_name: oae-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-order_allocation_database}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"      # 5433 so it never clashes with another Postgres on 5432
    volumes:
      - oae-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-order_allocation_database}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- The application itself (profile "app") ----------------------------------------------------------------
  # Start the whole stack:  docker compose --profile app up -d --build
  # It is in a PROFILE on purpose: Spring Boot's Docker Compose support starts every service that has no profile when
  # you run the app from the IDE, and that would start a second app on port 8080 next to your IDE run.
  # (Prometheus scrapes this service as app:8080, and the IDE run as host.docker.internal:8080; see prometheus.yml.)
  app:
    profiles: ["app"]
    build: .
    image: order-allocation-engine:local
    container_name: oae-app
    labels:
      org.springframework.boot.readiness.disable: "true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-order_allocation_database}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"        # we ARE the compose stack; do not look for one inside the container
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # Pass-through (no value): only set in the container when set in YOUR shell. Used by the chaos experiments in
      # load-tests/ to override one setting for one run, without changing any default.
      PAYMENT_FAKE_LATENCY_MS:
      PAYMENT_FAKE_FAILURE_RATE:
      PAYMENT_FAKE_TIMEOUT_RATE:
      CHECKOUT_RESERVATION_TTL:
      CHECKOUT_EXPIRY_INTERVAL:
    ports:
      # Host port 8081, NOT 8080: Prometheus scrapes host.docker.internal:8080 for the IDE run, and if this container
      # were also published on 8080 that target would reach the same app and every metric would be counted twice.
      - "${APP_PORT:-8081}:8080"
    healthcheck:
      # curl is part of the eclipse-temurin runtime image, so no extra package is needed
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ---- Observability (see observability/ and docs/slo.md) ---------------------------------------------------
  # Spring Boot Docker Compose starts every service in this file when the app starts. These two are not
  # something the app connects to, so the readiness label stops it from waiting for their ports.
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: oae-prometheus
    labels:
      org.springframework.boot.readiness.disable: "true"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - oae-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # already defined on Docker Desktop; needed on Linux so the host app is reachable
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    container_name: oae-grafana
    labels:
      org.springframework.boot.readiness.disable: "true"
    environment:
      # Local development only: anyone who can reach port 3000 can VIEW dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"      # no background download of unused plugins (it burns CPU and needs internet)
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - oae-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Distributed tracing UI and collector (Jaeger v2). The app sends spans to OTLP/HTTP on 4318; look at them on 16686.
  # Traces are kept in memory only: they are gone when the container restarts.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: oae-jaeger
    labels:
      org.springframework.boot.readiness.disable: "true"
    ports:
      - "16686:16686"   # UI and query API
      - "4318:4318"     # OTLP over HTTP (what the app uses)
    restart: unless-stopped

volumes:
  oae-pgdata:
  oae-prometheus-data:
  oae-grafana-data:
