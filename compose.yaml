services:
  postgres:
    image: postgres:18
    container_name: oae-postgres
    environment:
      POSTGRES_DB: order_allocation_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local dev only
    ports:
      - "5433:5432"                 # 5433 so it never clashes with another Postgres on 5432
    volumes:
      - oae-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_allocation_database"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  oae-pgdata:
