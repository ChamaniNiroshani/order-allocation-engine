# Prometheus for local development.
global:
  scrape_interval: 5s        # fast on purpose: dashboards react within a few seconds during a load test
  evaluation_interval: 5s

# SLO alerts (docs/slo.md). Prometheus evaluates them; there is no Alertmanager, so they show up on the Alerts page.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: order-allocation-engine
    metrics_path: /actuator/prometheus
    # Two ways to run the app, so two targets. Only one of them is up at a time (both use port 8080 on the host):
    #   run_mode=ide      the app runs on the HOST (IDE / mvnw spring-boot:run / java -jar). Prometheus is inside Docker,
    #                     so it reaches the host through host.docker.internal.
    #   run_mode=compose the app runs as the "app" service (docker compose --profile app up), reached by service name.
    # The dashboard queries filter on the application label and sum across series, so it works in both modes. The
    # target that is not running shows as DOWN on Status > Targets; that is expected, not a fault.
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          run_mode: ide
      - targets: ["app:8080"]
        labels:
          run_mode: compose
